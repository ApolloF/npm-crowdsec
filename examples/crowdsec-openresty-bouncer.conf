# Put in <npm data>/crowdsec/crowdsec-openresty-bouncer.conf (chmod 600). Full option list:
# /etc/nginx/crowdsec-openresty-bouncer.conf.example inside the image.
ENABLED=true
API_URL=http://CROWDSEC_LAPI_HOST:8080
API_KEY=REPLACE_WITH_cscli_bouncers_add_OUTPUT
MODE=stream
UPDATE_FREQUENCY=10
BOUNCING_ON_TYPE=all
FALLBACK_REMEDIATION=ban
REQUEST_TIMEOUT=3000
BAN_TEMPLATE_PATH=/var/lib/crowdsec/lua/templates/ban.html
CAPTCHA_TEMPLATE_PATH=/var/lib/crowdsec/lua/templates/captcha.html
APPSEC_URL=http://CROWDSEC_LAPI_HOST:7422
APPSEC_FAILURE_ACTION=passthrough
APPSEC_CONNECT_TIMEOUT=100
APPSEC_SEND_TIMEOUT=200
APPSEC_PROCESS_TIMEOUT=500
